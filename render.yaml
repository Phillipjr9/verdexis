services:
  - type: web
    name: verdexis-backend
    env: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "https://verdexisgroup.com,https://verdexis.pages.dev,https://www.verdexis.pages.dev,https://verdexis-bice.vercel.app,https://verdexis-h97f6m9cl-dianas-projects-32e424a3.vercel.app,https://verdexis-ckgz.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: APP_BASE_URL
        value: "https://verdexisgroup.com"
      - key: PRODUCTION_ORIGIN
        value: "https://verdexisgroup.com"
      - key: ALERT_POLL_ENABLED
        value: "true"
      - key: ALERT_POLL_INTERVAL_MS
        value: "60000"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
