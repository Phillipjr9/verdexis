services:
  - type: web
    name: verdexis-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npx tsc -p tsconfig.json --skipLibCheck
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://main.d28t5x0lqjdtjj.amplifyapp.com
      - key: APP_BASE_URL
        value: https://main.d28t5x0lqjdtjj.amplifyapp.com
