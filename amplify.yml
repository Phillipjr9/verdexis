version: 1
applications:
  - appRoot: app
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing all dependencies including devDependencies..."
            - npm ci --legacy-peer-deps
            - echo "Dependencies installed successfully"
        build:
          commands:
            - echo "Starting build with vite..."
            - npm run build
            - echo "Build completed successfully"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
