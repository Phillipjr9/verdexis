  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }
    .email-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }
    .header {
      padding: 24px;
      background: linear-gradient(135deg, #0f4c81 0%, #0077d9 100%);
      color: #ffffff;
      text-align: center;
    }
    .content {
      padding: 28px 32px;
    }
    .security-alert {
      background: #ffebee;
      border: 2px solid #f44336;
      border-radius: 8px;
      padding: 20px;
      margin: 16px 0;
      text-align: center;
    }
    .security-alert strong {
      color: #c62828;
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }
    .security-alert p {
      color: #c62828;
      margin: 8px 0;
    }
    .verification-code {
      background: #f7f9fb;
      border: 2px dashed #0077d9;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      font-family: 'Courier New', monospace;
    }
    .verification-code .code {
      font-size: 32px;
      font-weight: bold;
      color: #0077d9;
      letter-spacing: 4px;
      margin: 0;
    }
    .verification-code .label {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .action-required {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      color: #1565c0;
    }
    .action-required strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .button {
      display: inline-block;
      margin: 20px 0;
      padding: 14px 28px;
      background: #0077d9;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    .button-danger {
      background: #f44336;
    }
    .info-box {
      background: #f7f9fb;
      border: 1px solid #e0e6ed;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      font-size: 14px;
    }
    .info-box strong {
      color: #0f4c81;
    }
    .divider {
      border-top: 1px solid #e0e6ed;
      margin: 24px 0;
      padding-top: 16px;
    }
    .footer {
      padding: 24px 32px;
      background: #f4f6f8;
      color: #777;
      font-size: 13px;
      border-top: 1px solid #e0e6ed;
    }
  <!-- Security alert fragment -->
  <div style="padding:20px;font-family:Arial, sans-serif;color:#0f172a">
    <p style="margin:0 0 12px">Hi {{USER_NAME}},</p>
    <p style="margin:0 0 12px">We detected a sign-in from <strong>{{LOCATION}}</strong>. If this wasn't you, please secure your account.</p>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="width:100%"><tr><td align="center"><a href="{{SECURITY_URL}}" style="background:#dc2626;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;display:inline-block">Review activity</a></td></tr></table>
  </div>

            <div class="action-required">
              <strong>⚠️ Action Required:</strong>
              Please complete this action within {{EXPIRATION_TIME}} hours. After that, you'll need to request a new link.
            </div>

            <div style="text-align: center; margin: 24px 0;">
              <a href="{{ACTION_URL}}" class="button">{{BUTTON_TEXT}}</a>
            </div>

            <p style="font-size: 14px; color: #777;">
              Or copy and paste this link in your browser:<br/>
              <span style="word-break: break-all; background: #f7f9fb; padding: 8px; display: inline-block; border-radius: 4px; margin-top: 8px;">
                {{ACTION_URL}}
              </span>
            </p>

            <div class="divider">
              <h3 style="color: #0f4c81; margin-top: 0;">For Your Security:</h3>
              <ul style="color: #777; font-size: 14px; line-height: 1.6;">
                <li>Never share your password with anyone</li>
                <li>We will never ask for your password via email</li>
                <li>Always verify you're on verdexis.com before logging in</li>
                <li>Enable two-factor authentication for additional security</li>
              </ul>
            </div>

            <div class="info-box">
              <strong>Didn't request this action?</strong><br/>
              If you didn't initiate this request, someone may be trying to access your account. 
              <a href="{{SECURITY_HELP_URL}}" style="color: #f44336; font-weight: bold;">Secure your account immediately</a>
            </div>
          </div>

          <div class="footer">
            <strong>Verdexis</strong><br/>
            {{COMPANY_ADDRESS}}<br/>

            <a href="{{SECURITY_LINK}}" style="color: #0077d9;">Security</a><br/>
            © {{YEAR}} Verdexis. All rights reserved.
          </div>
        </div>

              <h1>Security Alert</h1>
            </td>
          </tr>
