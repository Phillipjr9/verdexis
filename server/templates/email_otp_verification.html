<!-- OTP fragment: wrapper will provide header/footer -->
<div style="padding:20px;font-family:Arial, sans-serif;color:#0f172a">
  <p style="margin:0 0 12px">Hi {{USER_NAME}},</p>
  <p style="margin:0 0 16px;color:#475569">Use the code below to verify your action. Don't share this code.</p>

  <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:18px;text-align:center;margin:12px 0">
    <p style="font-size:28px;letter-spacing:6px;font-weight:700;color:#0f4c81;margin:6px 0">{{OTP_CODE}}</p>
    <p style="font-size:13px;color:#475569;margin:0">Expires in {{EXPIRATION_MINUTES}} minutes ({{EXPIRATION_TIME}})</p>
  </div>

  <p style="margin:12px 0 0;color:#64748b;font-size:13px">If you didn't request this, ignore this email or <a href="{{CONTACT_SUPPORT_URL}}">contact support</a>.</p>
</div>
