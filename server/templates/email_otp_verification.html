<!-- OTP fragment: wrapper will provide header/footer -->
<div style="padding:20px;font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;color:#0f172a">
  <p style="margin:0 0 12px;font-size:16px;line-height:1.5">Hi {{USER_NAME}},</p>
  <p style="margin:0 0 18px;color:#475569;font-size:15px;line-height:1.6">Use the code below to verify your action. For your security, do not share it with anyone.</p>

  <div style="background:linear-gradient(135deg,#eef6ff 0%,#e0f2fe 100%);border:1px solid #bfdbfe;border-radius:12px;padding:22px;text-align:center;margin:18px 0;box-shadow:0 8px 20px rgba(15,76,129,0.06)">
    <p style="margin:0 0 8px;font-size:12px;font-weight:700;color:#1d4ed8;letter-spacing:1.6px;text-transform:uppercase">Verification code</p>
    <p style="font-size:32px;letter-spacing:8px;font-weight:800;color:#0f4c81;margin:0 0 10px;line-height:1.2">{{OTP_CODE}}</p>
    <p style="font-size:13px;color:#475569;margin:0">Expires in {{EXPIRATION_MINUTES}} minutes at {{EXPIRATION_TIME}}</p>
  </div>

  <p style="margin:12px 0 0;color:#64748b;font-size:13px;line-height:1.6">If you did not request this message, you can safely ignore it or <a href="{{CONTACT_SUPPORT_URL}}" style="color:#0f4c81;text-decoration:none;font-weight:600">contact support</a>.</p>
</div>
