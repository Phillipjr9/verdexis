<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{SUBJECT}}</title>
  <style>
    body { margin:0; padding:20px; background:#f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .container { max-width:600px; margin:0 auto; background:#ffffff; border-radius:8px; padding:28px; }
    .preheader { display:none !important; visibility:hidden; opacity:0; color:transparent; height:0; width:0; }
    .title { color:#0f4c81; margin:0 0 12px 0; }
    .content { color:#374151; line-height:1.6; font-size:16px; }
    .btn { display:inline-block; background:#0f4c81; color:#fff; text-decoration:none; padding:10px 16px; border-radius:6px; }
    .footer { margin-top:24px; font-size:12px; color:#6b7280; }
    a { color:#0f4c81; }
  </style>
</head>
<body>
  <div class="preheader">{{PREHEADER}}</div>
  <div class="container">
    <h2 class="title">{{SUBJECT}}</h2>
    <div class="content">{{BODY_HTML}}</div>
    <p style="margin-top:24px;"><a class="btn" href="{{CTA_URL}}">View in Verdexis</a></p>
    <div class="footer">
      <p>This message was sent by Verdexis. If you no longer wish to receive these emails, <a href="{{UNSUBSCRIBE_URL}}">unsubscribe</a>.</p>
      <p style="margin-top:8px;font-size:12px;color:#9ca3af;">Verdexis • 123 Finance Way • New York, NY</p>
    </div>
  </div>
</body>
</html>
