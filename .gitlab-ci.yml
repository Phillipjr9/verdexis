stages:
  - install
  - build
  - test
  - docker

variables:
  NODE_IMAGE: node:18
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

cache:
  paths:
    - server/node_modules/

install:
  image: $NODE_IMAGE
  stage: install
  script:
    - cd server
    - npm ci
  artifacts:
    paths:
      - server/node_modules/

build:
  image: $NODE_IMAGE
  stage: build
  script:
    - cd server
    - npm run build
  artifacts:
    paths:
      - server/dist

test:
  image: $NODE_IMAGE
  stage: test
  script:
    - cd server
    - npm test || true

docker_build:
  image: docker:24
  stage: docker
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Logging into container registry"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" -f Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

build_frontend:
  image: node:20
  stage: build
  script:
    - cd app
    - npm ci
    - npm run build
  artifacts:
    paths:
      - app/dist
  only:
    - main

deploy_vercel:
  image: node:20
  stage: deploy
  script:
    - cd app
    - npm ci --no-audit --no-fund
    - npx vercel --prod --yes --cwd . --token "$VERCEL_TOKEN" --force
  only:
    - main
